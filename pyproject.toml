[project]
name = "careerpilot-ai"
version = "0.2.0"
description = "Local Streamlit app for resume and job-description matching, built on a LangGraph multi-agent workflow with local RAG."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data/vectorstore", "outputs", ".pytest_tmp"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    # Long lines are left to the formatter rather than failing the build. The
    # Streamlit UI in particular has long literal strings that read worse when
    # wrapped by hand; app.py is split up in a later slice.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import modules for their side effects and reuse fixtures.
"tests/*" = ["B011"]
# run_eval.py is executed directly as a script, so it has to put the repository
# root on sys.path before it can import from src/.
"eval/run_eval.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep offline determinism: no test may depend on a real DEEPSEEK_API_KEY.
addopts = "-q"
# Tests import `from src...`, which only resolves by accident under
# `python -m pytest` because that puts the working directory on sys.path. Bare
# `pytest`, which is what CI runs, does not, and every test module failed to
# import. Setting it here makes both invocations behave the same.
pythonpath = ["."]
